name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cmake:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  install-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          cmake -S . -B build -DJESON_BUILD_TESTS=OFF -DJESON_BUILD_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX=${{ runner.temp }}/jeson
          cmake --build build --target install
      - name: Configure installed-package smoke test
        run: cmake -S tests/package -B consumer -DCMAKE_PREFIX_PATH=${{ runner.temp }}/jeson
      - name: Build installed-package smoke test
        run: cmake --build consumer --parallel
      - name: Run installed-package smoke test
        run: ./consumer/jeson_package_smoke

